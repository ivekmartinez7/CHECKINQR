name: Verify CheckInQR
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: checkinqr
          POSTGRES_PASSWORD: checkinqr_test
          POSTGRES_DB: checkinqr
        options: >-
          --health-cmd "pg_isready -U checkinqr"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 8
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://checkinqr:checkinqr_test@127.0.0.1:5432/checkinqr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput --verbosity 0
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test events
      - run: node --check events/static/events/ticket.js
