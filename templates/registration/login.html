{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="glass-panel" style="text-align: center;">
        <h2 style="margin-bottom: 0.5rem; color: var(--accent);">Acceso de Staff</h2>
        <p style="color: var(--text-muted); margin-top: 0; margin-bottom: 1.5rem;">Si tu móvil tiene huella o Face ID y guardaste la contraseña, podrás usarlo desde el gestor de contraseñas del dispositivo.</p>
        
        {% if form.errors %}
            <p style="color: var(--danger); margin-bottom: 1rem;">Usuario o contraseña incorrectos.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div style="text-align: left;">
                <label>Usuario</label>
                <input type="text" name="username" required autofocus autocomplete="username" inputmode="email">
                
                <label>Contraseña</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
            <input type="hidden" name="next" value="{{ next|default:'' }}">
        </form>
    </div>
</div>
{% endblock %}
