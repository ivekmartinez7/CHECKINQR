<div id="chat-toggle-btn" class="chat-toggle" onclick="toggleChat()">
    <span>💬 Chat Staff</span>
    <span id="chat-badge" class="chat-badge" style="display: none;">0</span>
</div>

<div id="chat-sidebar" class="chat-sidebar">
    <div class="chat-header">
        <h3>💬 Chat de Staff</h3>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <button onclick="clearChatHistory()" title="Limpiar conversación" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.1rem; padding: 0.2rem;">🗑️</button>
            <button class="chat-close" onclick="toggleChat()">✕</button>
        </div>
    </div>
    
    <div id="chat-history" class="chat-history">
        <!-- Messages will load here -->
        <div class="chat-system-message">Conectando al chat de control...</div>
    </div>
    
    <div class="chat-input-area">
        <form id="chat-form" onsubmit="sendTextMessage(event)" style="width: 100%; display: flex; flex-direction: column; gap: 0.5rem;">
            <div style="display: flex; gap: 0.5rem; align-items: center; position: relative;">
                <input type="text" id="chat-text-input" placeholder="Escribe un mensaje..." autocomplete="off">
                <button type="button" id="record-btn" class="chat-icon-btn" onclick="toggleRecording()" title="Grabar nota de voz">
                    🎤
                </button>
                <button type="submit" class="chat-icon-btn chat-send-btn">
                    ➔
                </button>
            </div>
            <div id="record-status" class="record-status" style="display: none;">
                <span class="record-dot"></span>
                <span id="record-timer">00:00</span>
                <button type="button" class="btn" style="background: var(--danger); padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="cancelRecording()">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<style>
    .chat-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--primary);
        color: white;
        padding: 0.8rem 1.5rem;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .chat-toggle:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 6px 24px rgba(99, 102, 241, 0.5);
    }
    .chat-badge {
        background: var(--danger);
        color: white;
        font-size: 0.8rem;
        padding: 0.15rem 0.45rem;
        border-radius: 10px;
        font-weight: 700;
    }
    .chat-sidebar {
        position: fixed;
        top: 0;
        right: -360px;
        width: 350px;
        height: 100%;
        background: rgba(17, 24, 39, 0.95);
        backdrop-filter: blur(16px);
        border-left: 1px solid var(--glass-border);
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        z-index: 1001;
        display: flex;
        flex-direction: column;
        transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .chat-sidebar.open {
        right: 0;
    }
    .chat-header {
        padding: 1rem;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0,0,0,0.2);
    }
    .chat-header h3 {
        margin: 0;
        font-size: 1.1rem;
    }
    .chat-close {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 1.2rem;
        cursor: pointer;
    }
    .chat-close:hover {
        color: white;
    }
    .chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }
    .chat-bubble {
        max-width: 80%;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        line-height: 1.4;
        position: relative;
        font-size: 0.95rem;
    }
    .chat-bubble.sent {
        align-self: flex-end;
        background: var(--primary);
        color: white;
        border-bottom-right-radius: 2px;
    }
    .chat-bubble.received {
        align-self: flex-start;
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--glass-border);
        color: var(--text);
        border-bottom-left-radius: 2px;
    }
    .chat-sender {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.25rem;
        display: block;
    }
    .chat-time {
        font-size: 0.65rem;
        opacity: 0.7;
        text-align: right;
        display: block;
        margin-top: 0.25rem;
    }
    .chat-bubble.sent .chat-sender {
        color: #fcd34d; /* Amber on primary bg */
    }
    .chat-system-message {
        align-self: center;
        font-size: 0.8rem;
        color: var(--text-muted);
        background: rgba(255,255,255,0.03);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        margin: 0.5rem 0;
    }
    .chat-input-area {
        padding: 1rem;
        border-top: 1px solid var(--glass-border);
        background: rgba(0,0,0,0.2);
    }
    .chat-input-area input {
        flex: 1;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 0.6rem 1rem;
        color: white;
        font-size: 0.95rem;
    }
    .chat-icon-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--glass-border);
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.1rem;
        transition: all 0.3s ease;
    }
    .chat-icon-btn:hover {
        background: rgba(255,255,255,0.15);
        transform: scale(1.05);
    }
    .chat-send-btn {
        background: var(--primary);
        border: none;
    }
    .chat-send-btn:hover {
        background: #4f46e5;
    }
    .record-status {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        padding: 0.5rem 1rem;
        border-radius: 12px;
        font-size: 0.9rem;
    }
    .record-dot {
        width: 8px;
        height: 8px;
        background: var(--danger);
        border-radius: 50%;
        animation: pulseRed 1s infinite alternate;
    }
    @keyframes pulseRed {
        from { opacity: 0.3; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1.15); }
    }
    
    /* Audio player custom styles */
    .voice-bubble audio {
        width: 100%;
        max-width: 220px;
        height: 32px;
        margin-top: 0.25rem;
    }
</style>

<script>
    let chatOpen = false;
    let lastMessageId = 0;
    let unreadCount = 0;
    let currentUserId = parseInt("{{ request.user.id|default:0 }}");
    
    // Polling Interval ID
    let chatInterval = null;
    
    // Media Recorder Variables
    let mediaRecorder = null;
    let audioChunks = [];
    let recordStartTime = null;
    let recordTimerInterval = null;

    function toggleChat() {
        chatOpen = !chatOpen;
        const sidebar = document.getElementById('chat-sidebar');
        if (chatOpen) {
            sidebar.classList.add('open');
            unreadCount = 0;
            updateBadge();
            scrollToBottom();
            // Start Polling immediately
            fetchMessages();
        } else {
            sidebar.classList.remove('open');
        }
    }

    function updateBadge() {
        const badge = document.getElementById('chat-badge');
        if (unreadCount > 0 && !chatOpen) {
            badge.innerText = unreadCount;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }
    }

    function scrollToBottom() {
        const history = document.getElementById('chat-history');
        history.scrollTop = history.scrollHeight;
    }

    function renderMessage(msg) {
        const history = document.getElementById('chat-history');
        
        // Check if message is already rendered
        if (document.getElementById(`msg-${msg.id}`)) return;
        
        const bubble = document.createElement('div');
        bubble.id = `msg-${msg.id}`;
        
        const isSent = msg.sender_id === currentUserId;
        bubble.className = `chat-bubble ${isSent ? 'sent' : 'received'} ${msg.audio_url ? 'voice-bubble' : ''}`;
        
        let content = '';
        content += `<span class="chat-sender">${msg.sender}</span>`;
        
        if (msg.text) {
            content += `<div>${msg.text}</div>`;
        }
        
        if (msg.audio_url) {
            content += `<audio src="${msg.audio_url}" controls preload="metadata"></audio>`;
        }
        
        content += `<span class="chat-time">${msg.created_at}</span>`;
        bubble.innerHTML = content;
        
        history.appendChild(bubble);
        
        if (!chatOpen) {
            unreadCount++;
            updateBadge();
        }
    }

    function fetchMessages() {
        fetch(`/api/chat/messages/?last_id=${lastMessageId}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.cleared) {
                        resetChatUI();
                        return;
                    }
                    if (data.messages.length > 0) {
                        // Remove initial system message if it exists
                        const sysMsg = document.querySelector('.chat-system-message');
                        if (sysMsg) sysMsg.remove();
                        
                        data.messages.forEach(msg => {
                            renderMessage(msg);
                            if (msg.id > lastMessageId) {
                                lastMessageId = msg.id;
                            }
                        });
                        scrollToBottom();
                    }
                }
            })
            .catch(err => console.error("Error fetching messages", err));
    }

    function clearChatHistory() {
        if (!confirm('¿Seguro que deseas limpiar todo el historial de chat del staff?')) return;
        
        fetch('/api/chat/messages/', {
            method: 'DELETE',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                resetChatUI();
            }
        })
        .catch(err => console.error("Error clearing chat", err));
    }

    function resetChatUI() {
        const history = document.getElementById('chat-history');
        history.innerHTML = '<div class="chat-system-message">La conversación ha sido limpiada.</div>';
        lastMessageId = 0;
    }

    function sendTextMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-text-input');
        const text = input.value.trim();
        if (!text) return;
        
        input.value = '';
        
        const formData = new FormData();
        formData.append('text', text);
        
        fetch('/api/chat/messages/', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                renderMessage(data.message);
                if (data.message.id > lastMessageId) {
                    lastMessageId = data.message.id;
                }
                scrollToBottom();
            }
        })
        .catch(err => console.error("Error sending text message", err));
    }

    // VOICE RECORDING IMPLEMENTATION
    function toggleRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            stopRecordingAndSend();
        } else {
            startRecording();
        }
    }

    function startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("Tu navegador no soporta grabación de audio.");
            return;
        }

        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };
                
                mediaRecorder.onstop = function() {
                    stream.getTracks().forEach(track => track.stop());
                    
                    if (audioChunks.length > 0 && recordStartTime) {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        uploadAudioMessage(audioBlob);
                    }
                    recordStartTime = null;
                };

                mediaRecorder.start();
                recordStartTime = Date.now();
                
                // Show UI Recording State
                document.getElementById('record-status').style.display = 'flex';
                document.getElementById('record-btn').innerText = '⏹️';
                document.getElementById('record-btn').style.background = 'var(--danger)';
                
                // Start timer
                let duration = 0;
                recordTimerInterval = setInterval(() => {
                    duration++;
                    const minutes = String(Math.floor(duration / 60)).padStart(2, '0');
                    const seconds = String(duration % 60).padStart(2, '0');
                    document.getElementById('record-timer').innerText = `${minutes}:${seconds}`;
                }, 1000);
            })
            .catch(err => {
                console.error("Error accessing microphone", err);
                alert("Permiso para usar el micrófono denegado.");
            });
    }

    function stopRecordingAndSend() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            clearRecordUI();
        }
    }

    function cancelRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            recordStartTime = null; // sets to null so onstop callback skips uploading
            mediaRecorder.stop();
            clearRecordUI();
        }
    }

    function clearRecordUI() {
        document.getElementById('record-status').style.display = 'none';
        document.getElementById('record-btn').innerText = '🎤';
        document.getElementById('record-btn').style.background = 'rgba(255,255,255,0.05)';
        document.getElementById('record-timer').innerText = '00:00';
        clearInterval(recordTimerInterval);
    }

    function uploadAudioMessage(blob) {
        const formData = new FormData();
        formData.append('audio', blob, 'recording.webm');
        
        fetch('/api/chat/messages/', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                renderMessage(data.message);
                if (data.message.id > lastMessageId) {
                    lastMessageId = data.message.id;
                }
                scrollToBottom();
            }
        })
        .catch(err => console.error("Error uploading audio", err));
    }

    // Auto-polling when page loads
    document.addEventListener("DOMContentLoaded", function() {
        fetchMessages();
        // Poll every 3 seconds
        chatInterval = setInterval(fetchMessages, 3000);
    });
</script>
