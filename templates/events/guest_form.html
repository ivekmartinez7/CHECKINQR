{% extends 'base.html' %}

{% block extra_css %}
<style>
    .edit-shell {
        max-width: 760px;
        margin: 0 auto;
    }

    .edit-header {
        margin-bottom: 1rem;
    }

    .edit-header p {
        color: var(--text-muted);
        margin: 0.25rem 0 0;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 1rem;
    }

    .form-grid .full {
        grid-column: 1 / -1;
    }

    .form-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
    }

    .form-actions .btn {
        flex: 1;
        text-align: center;
    }

    .btn-secondary {
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid var(--border);
        color: var(--text-soft);
    }

    @media (max-width: 720px) {
        .form-grid { grid-template-columns: 1fr; }
        .form-actions { flex-direction: column; }
    }
</style>
{% endblock %}

{% block content %}
<div class="edit-shell">
    <div class="edit-header">
        <h1 style="margin: 0;">Editar invitado</h1>
        <p>{{ guest.name }}</p>
    </div>
    <div class="glass-panel">
        <form method="POST">
            {% csrf_token %}
            <div class="form-grid">
            <div class="full">
            <label>Nombre Completo</label>
            <input type="text" name="name" value="{{ guest.name }}" required>
            </div>
            
            <div>
            <label>Correo Electrónico (Opcional)</label>
            <input type="email" name="email" value="{{ guest.email|default:'' }}">
            </div>
            
            <div>
            <label>Teléfono (Opcional)</label>
            <input type="text" name="phone" value="{{ guest.phone|default:'' }}">
            </div>
            
            <div>
            <label>Cantidad de Pases</label>
            <input type="number" id="passes-input" name="passes" value="{{ guest.passes }}" min="1" max="10" required {% if guest.parent %}readonly{% endif %}>
            </div>
            
            <div>
            <label>Rol</label>
            <select name="role" required>
                {% for r in roles %}
                    <option value="{{ r.name }}" {% if guest.role.id == r.id %}selected{% endif %}>{{ r.name }}</option>
                {% endfor %}
            </select>
            </div>
            
            <div class="full">
            <label>Escuela / Servicio (Opcional)</label>
            <input type="text" name="school" value="{{ guest.school|default:'' }}" placeholder="Ej. Primaria Rébsamen">
            </div>

            <div>
            <label>Género</label>
            <select name="gender">
                <option value="" {% if not guest.gender %}selected{% endif %}>Sin especificar</option>
                <option value="M" {% if guest.gender == 'M' %}selected{% endif %}>Hombre</option>
                <option value="F" {% if guest.gender == 'F' %}selected{% endif %}>Mujer</option>
                <option value="O" {% if guest.gender == 'O' %}selected{% endif %}>Otro</option>
            </select>
            </div>

            <div>
            <label>Monto Pagado</label>
            <input type="number" name="amount_paid" value="{{ guest.amount_paid|floatformat:2 }}" min="0" step="0.01">
            </div>
            </div>

            {% if not guest.parent %}
            <div id="companions-container"></div>
            {% endif %}
            
            <div class="form-actions">
                <button type="submit" class="btn btn-success">Guardar Cambios</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const passesInput = document.getElementById('passes-input');
        const companionsContainer = document.getElementById('companions-container');
        const roleOptions = `{% for r in roles %}<option value="{{ r.name|escapejs }}">{{ r.name|escapejs }}</option>{% endfor %}`;
        const existingCompanions = [
            {% for companion in companions %}
            {
                name: "{{ companion.name|escapejs }}",
                email: "{{ companion.email|default:''|escapejs }}",
                phone: "{{ companion.phone|default:''|escapejs }}",
                role: "{{ companion.role.name|default:''|escapejs }}",
                school: "{{ companion.school|default:''|escapejs }}",
                gender: "{{ companion.gender|default:''|escapejs }}",
                amount_paid: "{{ companion.amount_paid|floatformat:2 }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ];

        function optionSelected(options, value) {
            return options.replace(`value="${value}"`, `value="${value}" selected`);
        }

        function renderCompanionFields() {
            if (!passesInput || !companionsContainer) return;
            const passes = Math.max(parseInt(passesInput.value || '1', 10), 1);
            companionsContainer.innerHTML = '';
            if (passes <= 1) return;
            const title = document.createElement('h3');
            title.textContent = 'Datos de acompañantes';
            title.style.marginTop = '1rem';
            companionsContainer.appendChild(title);
            for (let i = 1; i < passes; i++) {
                const current = existingCompanions[i - 1] || {};
                const section = document.createElement('div');
                section.style.border = '1px solid var(--glass-border)';
                section.style.borderRadius = '8px';
                section.style.padding = '1rem';
                section.style.marginBottom = '1rem';
                section.innerHTML = `
                    <label>Acompañante ${i} - Nombre</label>
                    <input type="text" name="companion_${i}_name" value="${current.name || ''}" placeholder="Invitado ${i} del titular">
                    <label>Correo</label>
                    <input type="email" name="companion_${i}_email" value="${current.email || ''}">
                    <label>Teléfono</label>
                    <input type="text" name="companion_${i}_phone" value="${current.phone || ''}">
                    <label>Rol / Etiqueta</label>
                    <select name="companion_${i}_role">${optionSelected(roleOptions, current.role || '')}</select>
                    <label>Escuela / Servicio</label>
                    <input type="text" name="companion_${i}_school" value="${current.school || ''}">
                    <label>Género</label>
                    <select name="companion_${i}_gender">
                        <option value="" ${!current.gender ? 'selected' : ''}>Sin especificar</option>
                        <option value="M" ${current.gender === 'M' ? 'selected' : ''}>Hombre</option>
                        <option value="F" ${current.gender === 'F' ? 'selected' : ''}>Mujer</option>
                        <option value="O" ${current.gender === 'O' ? 'selected' : ''}>Otro</option>
                    </select>
                    <label>Monto Pagado</label>
                    <input type="number" name="companion_${i}_amount_paid" value="${current.amount_paid || '0'}" min="0" step="0.01">
                `;
                companionsContainer.appendChild(section);
            }
        }

        if (passesInput) {
            passesInput.addEventListener('input', renderCompanionFields);
            renderCompanionFields();
        }
    });
</script>
{% endblock %}
